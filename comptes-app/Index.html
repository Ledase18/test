<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><base target="_top">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mut:#6b7280;--ln:#e5e7eb;--pri:#0f766e;--neg:#b91c1c;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#191d23;--tx:#eceff3;--mut:#9aa3af;--ln:#2a303a;--pri:#2dd4bf;--neg:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding-bottom:76px}
main{max-width:560px;margin:0 auto;padding:12px 16px}
.hero{background:var(--pri);color:#062b27;border-radius:16px;padding:20px;text-align:center;margin-bottom:12px}
.hero.neg{background:var(--neg);color:#fff}.hero small{display:block;opacity:.85}.hero b{font-size:2.4rem}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}.row:first-of-type{border-top:0}
.row .l{flex:1;min-width:0;overflow-wrap:anywhere}.row .l small{display:block;color:var(--mut)}.row .a{font-variant-numeric:tabular-nums;white-space:nowrap}
.done .l,.done .a{opacity:.45;text-decoration:line-through}
input,select{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
label.k{display:flex;gap:8px;align-items:center;margin:2px 0 10px;color:var(--mut)}label.k input{width:auto;margin:0}
button{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 12px;cursor:pointer}
button.pri{background:var(--pri);color:#062b27;border-color:transparent;font-weight:600;width:100%;padding:12px}
button.ic{padding:6px 10px;min-width:40px}button.dng{color:var(--neg)}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--warn);color:#fff;margin-left:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 2px;font-size:.8rem;color:var(--mut)}nav button.on{color:var(--pri);font-weight:700}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.box{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:360px}.box p{margin:0 0 10px}.btns{display:flex;gap:8px}.btns button{flex:1}
#toast{position:fixed;left:16px;right:16px;bottom:88px;background:var(--neg);color:#fff;border-radius:10px;padding:10px 14px;display:none;z-index:10}
.busy{opacity:.5;pointer-events:none}.mut{color:var(--mut)}.tot{font-weight:700}
</style></head><body>
<main id="v">Chargement…</main><nav id="nav"></nav><div id="dlg"></div><div id="toast"></div>
<script>
let S=null,tab='reste';
const TABS=[['reste','Reste'],['dep','Dépenses'],['fixe','Charges'],['rev','Revenus'],['ann','Annuel']];
const MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const $=id=>document.getElementById(id);
const eur=n=>(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=s=>{const n=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isNaN(n)?null:n};
const val=id=>$(id).value;

function toast(m){const t=$('toast');t.textContent=String(m).replace(/^Error:\s*/,'');t.style.display='block';setTimeout(()=>t.style.display='none',4500)}
function call(fn,...a){
  $('v').classList.add('busy');
  google.script.run
    .withSuccessHandler(s=>{S=s;$('v').classList.remove('busy');render()})
    .withFailureHandler(e=>{$('v').classList.remove('busy');toast(e.message||e)})[fn](...a);
}
function ask(title,{value='',input=true,ok='OK'}={}){
  return new Promise(res=>{
    const d=$('dlg');
    d.innerHTML=`<div class="ov"><div class="box"><p>${esc(title)}</p>${input?`<input id="dv" inputmode="decimal" value="${esc(value)}">`:''}<div class="btns"><button data-d="0">Annuler</button><button class="pri" data-d="1">${esc(ok)}</button></div></div></div>`;
    if(input)$('dv').focus();
    d.querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=input?val('dv'):true;d.innerHTML='';res(b.dataset.d==='1'?v:null)});
  });
}

const line=(l,a,cls='')=>`<div class="row ${cls}"><div class="l">${l}</div><div class="a">${eur(a)}</div></div>`;

function vReste(){
  const upcoming=S.annual.filter(x=>x.monthIdx===S.month||x.monthIdx===(S.month+1)%12).sort((a,b)=>((a.monthIdx-S.month+12)%12)-((b.monthIdx-S.month+12)%12));
  return `<section class="hero ${S.reste<0?'neg':''}"><small>Reste à dépenser</small><b>${eur(S.reste)}</b></section>
  <section class="card"><h3>Calcul</h3>
   ${line('Solde du compte',S.solde)}${line('+ CA',S.ca)}${line('− Prêt conso',-S.pret)}
   ${line('− Dépenses en attente',-S.depTotal)}${line('− Revenus mis de côté',-S.revTotal)}${line('− Charges fixes à payer',-S.fixePending)}</section>
  <section class="card"><h3>Saisie</h3>
   <label class="mut">Solde du compte</label><input id="i_solde" inputmode="decimal" value="${S.solde}">
   <label class="mut">CA</label><input id="i_ca" inputmode="decimal" value="${S.ca}">
   <label class="mut">Prêt conso</label><input id="i_pret" inputmode="decimal" value="${S.pret}">
   <button class="pri" data-act="base">Enregistrer</button></section>
  ${upcoming.length?`<section class="card"><h3>À prévoir</h3>${upcoming.map(x=>`<div class="row"><div class="l">${esc(x.label)}<small>${esc(x.month)}${x.monthIdx===S.month?'<span class="tag">ce mois</span>':''}</small></div><div class="a">${eur(x.amount)}</div></div>`).join('')}</section>`:''}`;
}

function vDep(){
  return `<section class="card"><h3>Ajouter une dépense</h3>
   <select id="d_cat">${S.cats.map(c=>`<option value="${c.row}">${esc(c.label)}</option>`).join('')}</select>
   <input id="d_amt" inputmode="decimal" placeholder="Montant">
   <button class="pri" data-act="addDep">Ajouter</button></section>
  <section class="card"><h3>En attente · <span class="tot">${eur(S.depTotal)}</span></h3>
   ${S.ops.length?S.ops.map(o=>`<div class="row"><div class="l">${esc(o.label)}</div><div class="a">${eur(o.amount)}</div><button class="ic" data-act="passDep" data-row="${o.row}" data-slot="${o.slot}" title="Opération passée">✓</button></div>`).join(''):'<span class="mut">Rien en attente.</span>'}</section>`;
}

function vFixe(){
  return `<section class="card"><h3>Charges du mois · à payer <span class="tot">${eur(S.fixePending)}</span></h3>
   ${S.fixes.map(f=>{const paid=f.pending===0;return `<div class="row ${paid?'done':''}"><div class="l">${esc(f.label)}<small>modèle ${eur(f.model)}</small></div><div class="a" data-act="editFixe" data-row="${f.row}" data-v="${f.model}">${eur(paid?f.model:f.pending)}</div>
    <button class="ic" data-act="payFixe" data-row="${f.row}" data-paid="${paid?0:1}">${paid?'↺':'✓'}</button>
    <button class="ic dng" data-act="delFixe" data-row="${f.row}">×</button></div>`}).join('')}</section>
  <section class="card"><h3>Ajouter une charge</h3>
   <input id="f_lbl" placeholder="Libellé"><input id="f_amt" inputmode="decimal" placeholder="Montant">
   <label class="k"><input type="checkbox" id="f_now" checked>À payer ce mois</label>
   <button class="pri" data-act="addFixe">Ajouter</button></section>
  <section class="card"><h3>Début de mois</h3><p class="mut" style="margin-top:0">Recopie les montants modèles en « à payer » et efface les revenus mis de côté.</p>
   <button data-act="newMonth" style="width:100%">Nouveau mois</button></section>`;
}

function vRev(){
  return `<section class="card"><h3>Revenus mis de côté · <span class="tot">${eur(S.revTotal)}</span></h3>
   <p class="mut" style="margin-top:0">Reçus en fin de mois, déjà sur le compte : retirés du reste jusqu'au 1er.</p>
   ${S.revs.map(r=>`<div class="row"><div class="l">${esc(r.label)}</div><div class="a" data-act="editRev" data-row="${r.row}" data-v="${r.amount}">${eur(r.amount+r.extra)}</div><button class="ic" data-act="editRev" data-row="${r.row}" data-v="${r.amount}">✎</button></div>`).join('')}</section>`;
}

function vAnn(){
  const rows=S.annual.slice().sort((a,b)=>((a.monthIdx<0?99:(a.monthIdx-S.month+12)%12))-((b.monthIdx<0?99:(b.monthIdx-S.month+12)%12)));
  return `<section class="card"><h3>Charges annuelles</h3>
   ${rows.length?rows.map(x=>`<div class="row"><div class="l">${esc(x.label)||'<span class="mut">(sans libellé)</span>'}<small>${esc(x.month)}${x.monthIdx===S.month?'<span class="tag">ce mois</span>':''}</small></div><div class="a">${eur(x.amount)}</div><button class="ic dng" data-act="delAnn" data-row="${x.row}">×</button></div>`).join(''):'<span class="mut">Aucune.</span>'}</section>
  <section class="card"><h3>Ajouter</h3>
   <select id="a_m">${MOIS.map((m,i)=>`<option value="${i}" ${i===S.month?'selected':''}>${m}</option>`).join('')}</select>
   <input id="a_lbl" placeholder="Libellé"><input id="a_amt" inputmode="decimal" placeholder="Montant">
   <button class="pri" data-act="addAnn">Ajouter</button></section>`;
}

function render(){
  $('nav').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${l}</button>`).join('');
  if(!S){return}
  $('v').innerHTML={reste:vReste,dep:vDep,fixe:vFixe,rev:vRev,ann:vAnn}[tab]();
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  const d=t.dataset,row=+d.row;
  const need=(v,m)=>{if(v===null){toast(m||'Montant invalide.');return false}return true};
  switch(d.act){
    case'base':{const o={solde:num(val('i_solde')),ca:num(val('i_ca')),pret:num(val('i_pret'))};
      if(Object.values(o).some(x=>x===null||x<0))return toast('Montants invalides.');call('saveBase',o);break}
    case'addDep':{const a=num(val('d_amt'));if(!need(a)||a<=0)return toast('Montant invalide.');call('addExpense',+val('d_cat'),a);break}
    case'passDep':call('clearExpense',row,+d.slot);break;
    case'payFixe':call('payFixe',row,d.paid==='1');break;
    case'editFixe':{const v=await ask('Nouveau montant (modèle et mois)',{value:d.v});if(v===null)return;const a=num(v);if(!need(a))return;call('editFixe',row,a);break}
    case'delFixe':{if(await ask('Supprimer cette charge du fichier ?',{input:false,ok:'Supprimer'}))call('deleteFixe',row);break}
    case'addFixe':{const a=num(val('f_amt'));if(!need(a))return;call('addFixe',val('f_lbl'),a,$('f_now').checked);break}
    case'newMonth':{if(await ask('Recopier les charges modèles et effacer les revenus mis de côté ?',{input:false,ok:'Confirmer'}))call('newMonth');break}
    case'editRev':{const v=await ask('Montant',{value:d.v});if(v===null)return;const a=num(v);if(!need(a))return;call('setRevenu',row,a);break}
    case'addAnn':{const a=num(val('a_amt'));if(!need(a))return;call('addAnnual',+val('a_m'),val('a_lbl'),a);break}
    case'delAnn':{if(await ask('Supprimer cette ligne ?',{input:false,ok:'Supprimer'}))call('deleteAnnual',row);break}
  }
});
render();call('getState');
</script></body></html>
