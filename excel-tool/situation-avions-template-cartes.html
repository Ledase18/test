<title>Situation Avions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Titillium+Web:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#001b3a;
    --navy-800:#062a52;
    --navy-700:#0d3a6b;
    --sky-500:#00a8e1;
    --sky-300:#7fd4f0;
    --bg:#eef2f7;
    --surface:#ffffff;
    --surface-2:#f6f8fb;
    --ink:#0b1626;
    --muted:#57667c;
    --line:#dbe3ee;
    --ok-600:#178a52;
    --ok-100:#e2f6ea;
    --ok-wash:#f2faf5;
    --warn-600:#c96a02;
    --warn-100:#fcedd9;
    --warn-wash:#fdf7ee;
    --crit-600:#c0362f;
    --crit-100:#fbe6e4;
    --crit-wash:#fdf1f0;
    --info-600:#0b6fa8;
    --info-100:#e1f3fb;
    --info-wash:#f0f8fc;
    --neutral-600:#5b6b82;
    --neutral-100:#eef1f5;
    --font-display:'Barlow Condensed',system-ui,sans-serif;
    --font-body:'Titillium Web',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a1220;
      --surface:#101b2d;
      --surface-2:#0d1826;
      --ink:#e8edf5;
      --muted:#93a3ba;
      --line:#1f2f47;
      --navy-900:#001b3a;
      --navy-800:#0a2c53;
      --ok-600:#57d996;
      --ok-100:#0e2a20;
      --ok-wash:#0c1e18;
      --warn-600:#f0b355;
      --warn-100:#332508;
      --warn-wash:#241c0e;
      --crit-600:#ff8b83;
      --crit-100:#3a1310;
      --crit-wash:#271512;
      --info-600:#6fc6f2;
      --info-100:#0c2536;
      --info-wash:#0d1e2a;
      --neutral-600:#93a3ba;
      --neutral-100:#16222f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a1220;
    --surface:#101b2d;
    --surface-2:#0d1826;
    --ink:#e8edf5;
    --muted:#93a3ba;
    --line:#1f2f47;
    --navy-900:#001b3a;
    --navy-800:#0a2c53;
    --ok-600:#57d996;
    --ok-100:#0e2a20;
    --ok-wash:#0c1e18;
    --warn-600:#f0b355;
    --warn-100:#332508;
    --warn-wash:#241c0e;
    --crit-600:#ff8b83;
    --crit-100:#3a1310;
    --crit-wash:#271512;
    --info-600:#6fc6f2;
    --info-100:#0c2536;
    --info-wash:#0d1e2a;
    --neutral-600:#93a3ba;
    --neutral-100:#16222f;
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    padding-inline:0;
  }

  .board{
    max-width:900px;
    margin:0 auto;
    background:var(--bg);
  }

  /* ---------- header ---------- */
  .topbar{
    background:linear-gradient(180deg,var(--navy-900),var(--navy-800));
    color:#fff;
    padding:18px 20px 16px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    border-bottom:3px solid var(--sky-500);
  }
  .wordmark{
    font-family:var(--font-display);
    font-weight:800;
    font-size:30px;
    letter-spacing:2px;
    line-height:1;
  }
  .wordmark span{color:var(--sky-300)}
  .wordmark small{
    display:block;
    font-family:var(--font-body);
    font-weight:600;
    font-size:11px;
    letter-spacing:3px;
    color:var(--sky-300);
    margin-top:4px;
    text-transform:uppercase;
  }
  .wordmark small.site{
    color:var(--muted);
    font-size:10px;
    letter-spacing:2px;
    margin-top:2px;
  }
  .clockblock{text-align:right}
  .datestr{font-size:12.5px;color:var(--sky-300);font-weight:600}
  .quantieme{font-size:11px;color:#9db8d6;margin-top:1px}
  .clock{
    font-family:var(--font-display);
    font-weight:700;
    font-size:26px;
    letter-spacing:1px;
    font-variant-numeric:tabular-nums;
    margin-top:2px;
  }

  .titlebar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:18px 20px 10px;
  }
  .titlebar h1{
    margin:0;
    font-family:var(--font-display);
    font-weight:800;
    font-size:30px;
    letter-spacing:0.5px;
    color:var(--navy-900);
  }
  :root:not([data-theme="light"]) .titlebar h1{color:var(--ink)}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .titlebar h1{color:var(--ink)}}
  .kannad-pill{text-align:right; flex:none}
  .kannad-pill .lbl{
    display:block;
    font-family:var(--font-body);
    font-weight:700;
    font-size:10px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--muted);
    white-space:nowrap;
  }
  .kannad-pill .val{
    font-family:var(--font-display);
    font-weight:700;
    font-size:17px;
    font-variant-numeric:tabular-nums;
    color:var(--navy-800);
  }
  :root:not([data-theme="light"]) .kannad-pill .val{color:var(--sky-300)}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kannad-pill .val{color:var(--sky-300)}}

  /* ---------- legend ---------- */
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
    padding:0 20px 14px;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11.5px;
    color:var(--muted);
    font-weight:600;
  }
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dot.crit{background:var(--crit-600)}
  .dot.warn{background:var(--warn-600)}
  .dot.info{background:var(--info-600)}
  .dot.ok{background:var(--ok-600)}
  .dot.neutral{background:var(--neutral-600)}

  /* ---------- aircraft list ---------- */
  .list{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:0 14px 22px;
  }
  .row{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:11px solid var(--neutral-600);
    border-radius:10px;
    padding:12px 14px 12px 12px;
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .row.crit{border-left-color:var(--crit-600)}
  .row.warn{border-left-color:var(--warn-600)}
  .row.info{border-left-color:var(--info-600)}
  .row.ok{border-left-color:var(--ok-600)}

  .idblock{
    flex:none;
    width:104px;
    text-align:left;
  }
  .tail{
    font-family:var(--font-display);
    font-weight:800;
    font-size:24px;
    line-height:1;
    letter-spacing:0.5px;
    font-variant-numeric:tabular-nums;
  }
  .pos{
    margin-top:4px;
    display:inline-block;
    font-family:var(--font-body);
    font-weight:700;
    font-size:12px;
    color:var(--navy-800);
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:2px 7px;
  }
  :root:not([data-theme="light"]) .pos{color:var(--sky-300)}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pos{color:var(--sky-300)}}

  .chips{
    flex:1 1 auto;
    min-width:0;
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap:5px 6px;
  }
  .chip{
    display:inline-flex;
    align-items:baseline;
    gap:4px;
    font-size:11.5px;
    font-weight:600;
    border-radius:6px;
    padding:3px 7px;
    line-height:1.3;
    white-space:nowrap;
  }
  .chip .k{
    font-size:9.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    opacity:0.72;
  }
  .chip .v{font-family:var(--font-display);font-weight:700;font-size:13px}
  .chip.neutral{background:var(--neutral-100);color:var(--neutral-600)}
  .chip.crit{background:var(--crit-100);color:var(--crit-600)}
  .chip.warn{background:var(--warn-100);color:var(--warn-600)}
  .chip.info{background:var(--info-100);color:var(--info-600)}
  .chip.ok{background:var(--ok-100);color:var(--ok-600)}

  .obs{
    flex:1 1 230px;
    max-width:260px;
    align-self:flex-start;
    margin-top:-4px;
    font-size:12.5px;
    line-height:1.4;
    color:var(--ink);
    border-left:1px solid var(--line);
    padding-left:12px;
  }
  .obs .k{
    display:block;
    font-family:var(--font-display);
    font-weight:700;
    font-size:10.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:2px;
  }

  .vest{
    flex:none;
    align-self:flex-start;
    font-size:10.5px;
    font-weight:700;
    color:var(--warn-600);
    background:var(--warn-100);
    border-radius:6px;
    padding:3px 6px;
    text-align:center;
    line-height:1.15;
  }

  /* ---------- plan de stationnement ---------- */
  .section-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:18px;
    letter-spacing:0.5px;
    color:var(--navy-900);
    padding:2px 20px 10px;
  }
  :root:not([data-theme="light"]) .section-title{color:var(--ink)}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .section-title{color:var(--ink)}}

  .apron{
    margin:0 14px 22px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
  }
  .apron svg{width:100%;max-width:620px;height:auto;display:block;margin:0 auto}
  .stand-outline{fill:var(--surface-2);stroke:var(--line);stroke-width:2}
  .stand-outline.occ-crit{fill:var(--crit-100);stroke:var(--crit-600)}
  .stand-outline.occ-warn{fill:var(--warn-100);stroke:var(--warn-600)}
  .stand-outline.occ-info{fill:var(--info-100);stroke:var(--info-600)}
  .stand-outline.occ-ok{fill:var(--ok-100);stroke:var(--ok-600)}
  .stand-code{
    font-family:var(--font-body);
    font-weight:700;
    font-size:11px;
    fill:var(--muted);
  }
  .stand-occ{
    font-family:var(--font-display);
    font-weight:800;
    font-size:13px;
    fill:var(--ink);
  }
  .stand-occ.occ-crit{fill:var(--crit-600)}
  .stand-occ.occ-warn{fill:var(--warn-600)}
  .stand-occ.occ-info{fill:var(--info-600)}
  .stand-occ.occ-ok{fill:var(--ok-600)}
  .diagram-line{fill:none;stroke:var(--line);stroke-width:3}
  .diagram-fill{fill:var(--surface-2);stroke:var(--line);stroke-width:2.5}
  .pod-label,.diagram-label{
    font-family:var(--font-display);
    font-weight:700;
    font-size:16px;
    letter-spacing:1px;
    fill:var(--muted);
    text-transform:uppercase;
  }
  .lavage-box{fill:var(--surface-2);stroke:var(--line);stroke-width:2}
  .lavage-label{font-family:var(--font-body);font-weight:700;font-size:12px;fill:var(--muted)}

  @media (max-width:420px){
    .idblock{width:76px}
    .tail{font-size:21px}
  }
</style>

<div class="board">
  <header class="topbar">
    <div class="wordmark">AIRBUS<span>.</span><small>Defence Training and Services</small><small class="site">Piste Avord</small></div>
    <div class="clockblock">
      <div class="datestr" id="datestr">Samedi 19 Septembre 2026</div>
      <div class="quantieme">Quantième&nbsp;262</div>
      <div class="clock" id="clock">11:00:19&nbsp;Z</div>
    </div>
  </header>

  <div class="titlebar">
    <h1>Situation avions</h1>
    <div class="kannad-pill"><span class="lbl">MAJ FDS / KANNAD</span><span class="val">__KANNAD_DATE__</span></div>
  </div>

  <div class="legend">
    <span class="legend-item"><span class="dot crit"></span>Indispo / incomplet</span>
    <span class="legend-item"><span class="dot info"></span>Vol</span>
    <span class="legend-item"><span class="dot ok"></span>Prêt</span>
  </div>

  <div class="list" id="list"></div>

  <div class="section-title">Plan de stationnement</div>
  <div class="apron" id="apron"></div>
</div>

<script>
  // Règle confirmée : sur PTR/AVQ, un "I" = rouge (indispo), sinon vert, sauf si
  // l'avion est en vol (bleu). MTN et les autres trigrammes n'ont pas de couleur
  // dédiée -- ce ne sont que des libellés d'état, pas des indicateurs de gravité.
  function stateOf(a){
    if (a.ptr === "I" || a.avq === "I" || a.plein === "INC") return "crit";
    if (a.am === "VOL" || a.pm === "VOL" || a.vdn === "VOL") return "info";
    return "ok";
  }
  function chip(label, value, cls){
    if (!value) return "";
    return `<span class="chip ${cls}"><span class="k">${label}</span><span class="v">${value}</span></span>`;
  }
  function chipsFor(a){
    let h = "";
    h += chip("O2", a.o2 ? "X" : "", "info");
    h += chip("Camp", a.camp ? "X" : "", "neutral");
    h += chip("AM", a.am, a.am === "VOL" ? "info" : "neutral");
    h += chip("PM", a.pm, a.pm === "VOL" ? "info" : "neutral");
    h += chip("VDN", a.vdn, a.vdn === "VOL" ? "info" : "neutral");
    h += chip("PTR", a.ptr, a.ptr === "I" ? "crit" : "neutral");
    h += chip("AVQ", a.avq, a.avq === "I" ? "crit" : "neutral");
    h += chip("Plein", a.plein, pleinColor(a));
    return h;
  }
  // Couleur du plein (règle confirmée) : bleu en vol ; vert dès qu'il y a un "V"
  // en colonne N, même sans PLEIN/TRG+Qté ; orange si PLEIN ET TRG+Qté renseignés
  // mais pas encore de V ; rouge si PLEIN seul (sans TRG+Qté) ou rien du tout.
  function pleinColor(a){
    if (a.am === "VOL" || a.pm === "VOL" || a.vdn === "VOL") return "info";
    if (a.v) return "ok";
    if (a.plein === "INC") return "crit";
    if (a.plein && a.trg) return "warn";
    return "crit";
  }

  function normPos(pos){
    // "A7" -> {zone:"A", num:"7"} / "11" -> {zone:"Voie", num:"11"} / "lav" -> spécial
    if (!pos) return null;
    const m = pos.match(/^([A-Za-z]+)(\d+)$/);
    if (m) return {zone: m[1].toUpperCase(), num: m[2]};
    if (/^\d+$/.test(pos)) return {zone:"Voie", num: pos};
    return {zone:"special", num: pos};
  }

  function slotBadge(cx, cy, slotLabel, occ){
    const w = 32, h = 22, rx = cx - w/2, ry = cy - h/2;
    if (occ){
      const st = stateOf(occ);
      const code = occ.tail.split(" ").pop();
      return `<g>
        <rect class="stand-outline occ-${st}" x="${rx}" y="${ry}" width="${w}" height="${h}" rx="4"/>
        <text class="stand-occ occ-${st}" x="${cx}" y="${cy+4}" text-anchor="middle">${code}</text>
        <text class="stand-code" x="${cx}" y="${ry-4}" text-anchor="middle">${slotLabel}</text>
      </g>`;
    }
    return `<g>
      <rect class="stand-outline" x="${rx}" y="${ry}" width="${w}" height="${h}" rx="4"/>
      <text class="stand-occ" x="${cx}" y="${cy+4}" text-anchor="middle">${slotLabel}</text>
    </g>`;
  }

  // Repères de la voie en peigne : juste le numéro posé sur la ligne (pas de
  // case), et un badge seulement quand un avion est réellement stationné dessus.
  function lineSlot(cx, cy, slotLabel, occ){
    if (occ) return slotBadge(cx, cy, slotLabel, occ);
    return `<text class="stand-code" x="${cx}" y="${cy+4}" text-anchor="middle" style="font-size:13px">${slotLabel}</text>`;
  }

  // Construit tout l'affichage (liste + plan) à partir des données -- appelée au
  // chargement initial ET à chaque rafraîchissement (voir refreshData), pour ne
  // jamais recharger la page entière (évite le flash toutes les 5s).
  function render(AIRCRAFT, KANNAD_DATE){
    document.querySelector(".kannad-pill .val").textContent = KANNAD_DATE;

    // Un avion masqué (Masquer = "x" sur Situation) sort du tableau ET du plan de
    // stationnement -- il reste dans les données mais n'est plus affiché sur Visu.
    const VISIBLE = AIRCRAFT.filter(a => !a.masque);

    const list = document.getElementById("list");
    list.innerHTML = VISIBLE.map(a => {
      const st = stateOf(a);
      return `
        <div class="row ${st}">
          <div class="idblock">
            <div class="tail">${a.tail}</div>
            ${a.pos ? `<span class="pos">${a.pos}</span>` : ""}
          </div>
          <div class="chips">${chipsFor(a)}</div>
          ${a.obs ? `<div class="obs"><span class="k">Obs.</span>${a.obs}</div>` : ""}
        </div>`;
    }).join("");

    // ---------- plan de stationnement ----------
    // Schéma reconstitué à partir d'une capture du plan Visu existant (voie en
    // peigne, postes 7-22 en haut / 6-1 en bas, 4 postes de dégivrage/parking
    // A-D + case Lavage). Les proportions sont approximatives : à recaler sur
    // les coordonnées réelles si le tracé ne correspond pas au terrain.
    const occByStand = {};
    let lavage = null;
    VISIBLE.forEach(a => {
      const p = normPos(a.pos);
      if (!p) return;
      if (p.zone === "special"){ if (p.num.toLowerCase() === "lav") lavage = a; return; }
      occByStand[p.zone + "|" + p.num] = a;
    });

    // ---- voie en peigne (postes 7-22 en haut, 6-1 en bas) ----
    // Chaque poste est une ligne de guidage au sol : l'avion la suit et stationne
    // SUR la ligne (pas dans une case entre deux lignes) -- donc une seule ligne
    // par poste, pas de parois de chaque côté.
    const combX0 = 170, standW = 48, nUpper = 16;
    const upperTopY = 55, spineY = 185, lowerBotY = 300;
    const combRight = combX0 + nUpper * standW - standW / 2;

    let combLines = "";
    combLines += `<path class="diagram-line" d="M${combX0},${upperTopY} L${combX0-90},${spineY} L${combX0},${lowerBotY}"/>`;
    combLines += `<line class="diagram-line" x1="${combX0}" y1="${spineY}" x2="${combRight+standW/2}" y2="${spineY}"/>`;

    let combSlots = "";
    for (let i = 0; i < nUpper; i++){
      const num = String(7 + i);
      const cx = combX0 + i * standW + standW / 2;
      combLines += `<line class="diagram-line" x1="${cx}" y1="${upperTopY}" x2="${cx}" y2="${spineY}"/>`;
      combSlots += lineSlot(cx, (upperTopY + spineY) / 2, num, occByStand["Voie|" + num]);
    }
    for (let i = 0; i < 6; i++){
      const num = String(6 - i);
      const cx = combX0 + i * standW + standW / 2;
      combLines += `<line class="diagram-line" x1="${cx}" y1="${spineY}" x2="${cx}" y2="${lowerBotY}"/>`;
      combSlots += lineSlot(cx, (spineY + lowerBotY) / 2, num, occByStand["Voie|" + num]);
    }

    // ---- case Lavage ----
    const lavX = 800, lavY = 308, lavW = 150, lavH = 38;
    let lavageHtml = `
      <rect class="lavage-box" x="${lavX}" y="${lavY}" width="${lavW}" height="${lavH}" rx="4"/>
      <line class="diagram-line" x1="${lavX+86}" y1="${lavY}" x2="${lavX+86}" y2="${lavY+lavH}"/>
      <text class="lavage-label" x="${lavX+12}" y="${lavY+lavH/2+4}">Lavage</text>`;
    lavageHtml += lavage
      ? `<text class="stand-occ occ-${stateOf(lavage)}" x="${lavX+118}" y="${lavY+lavH/2+5}" text-anchor="middle">${lavage.tail.split(" ").pop()}</text>`
      : `<text class="stand-occ" x="${lavX+118}" y="${lavY+lavH/2+5}" text-anchor="middle">&mdash;</text>`;

    // ---- postes A / B / C / D (formes chanfreinées avec grille de postes) ----
    const podY = 378, podH = 165;
    const PODS = [
      {id:"A", x:40,  y:podY, w:175, h:podH, apex:true,
        rows:[["3","2","4"],["6","5","7"],["9","8",null]]},
      {id:"B", x:215, y:podY, w:185, h:podH, apex:true,
        rows:[["3","2","4"],["6","5","7"],["9","8","10"]]},
      {id:"C", x:415, y:podY, w:170, h:podH, apex:false,
        rows:[["3","1","2"],["6","4","5"],["7",null,"8"]]},
      {id:"D", x:585, y:podY, w:170, h:podH, apex:false,
        rows:[["3","1","2"],["6","4","5"],["7",null,"8"]]},
    ];

    let podsHtml = "";
    PODS.forEach(p => {
      let path, gy0, gh;
      if (p.apex){
        const peakH = 36;
        path = `M${p.x+p.w/2},${p.y} L${p.x+p.w},${p.y+peakH} L${p.x+p.w},${p.y+p.h} L${p.x},${p.y+p.h} L${p.x},${p.y+peakH} Z`;
        gy0 = p.y + peakH + 16; gh = p.h - peakH - 28;
      } else {
        const c = 28;
        path = `M${p.x+c},${p.y} L${p.x+p.w-c},${p.y} L${p.x+p.w},${p.y+c} L${p.x+p.w},${p.y+p.h} L${p.x},${p.y+p.h} L${p.x},${p.y+c} Z`;
        gy0 = p.y + c + 18; gh = p.h - c - 30;
      }
      podsHtml += `<path class="diagram-fill" d="${path}"/>`;
      podsHtml += `<text class="pod-label" x="${p.x+p.w/2}" y="${p.y-12}" text-anchor="middle">${p.id}</text>`;

      if (p.apex){
        const cx = p.x + p.w/2, cy = p.y + 36*0.62 + 8;
        podsHtml += slotBadge(cx, cy, "1", occByStand[p.id + "|1"]);
      }

      const colX = [p.x + p.w/6, p.x + p.w/2, p.x + p.w*5/6];
      const rowY = [gy0 + gh/6, gy0 + gh/2, gy0 + gh*5/6];
      p.rows.forEach((row, ri) => {
        row.forEach((num, ci) => {
          if (num === null) return;
          podsHtml += slotBadge(colX[ci], rowY[ri], num, occByStand[p.id + "|" + num]);
        });
      });
    });

    document.getElementById("apron").innerHTML = `<svg viewBox="0 0 1000 570" xmlns="http://www.w3.org/2000/svg">
      <g>${combLines}</g>
      <g>${combSlots}</g>
      <g>${lavageHtml}</g>
      <g>${podsHtml}</g>
    </svg>`;
  }

  // Le bloc entre les deux marqueurs est régénéré intégralement par la macro
  // GenererHTMLSituation (Module1, piste - V3.xlsm) à partir de Situation!B7:S31
  // à chaque export -- ne pas éditer les données à la main dans le fichier exporté
  // (situation-avions.html), seulement dans ce template. v:true = colonne N ("V",
  // plein validé). masque:true = colonne S ("Masquer").
  /*DATA_START*/
  const AIRCRAFT = __AIRCRAFT_DATA__;
  const KANNAD_DATE = "__KANNAD_DATE__";
  /*DATA_END*/
  render(AIRCRAFT, KANNAD_DATE);

  function tick(){
    // Heure UTC (le "Z" affiché est le vrai suffixe Zulu, pas juste un libellé).
    const now = new Date();
    const days = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
    const months = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
    const d = days[now.getUTCDay()], m = months[now.getUTCMonth()];
    document.getElementById("datestr").textContent = `${d} ${now.getUTCDate()} ${m} ${now.getUTCFullYear()}`;
    const hh = String(now.getUTCHours()).padStart(2,"0");
    const mm = String(now.getUTCMinutes()).padStart(2,"0");
    const ss = String(now.getUTCSeconds()).padStart(2,"0");
    document.getElementById("clock").innerHTML = `${hh}:${mm}:${ss}&nbsp;Z`;
  }
  tick();
  setInterval(tick, 1000);

  // Le fichier est réécrit sur disque par piste-V3 à chaque Actualiser/Valider.
  // On va chercher sa propre dernière version toutes les 5s et on ne remplace que
  // le contenu (pas de location.reload -- ça évite le flash plein écran). Ça
  // nécessite que le navigateur soit lancé avec --allow-file-access-from-files
  // (voir LancerTV) : fetch() sur un fichier local est bloqué par défaut sinon.
  async function refreshData(){
    try {
      const res = await fetch(location.href.split("?")[0] + "?_=" + Date.now(), {cache:"no-store"});
      if (!res.ok) throw new Error("http " + res.status);
      const text = await res.text();
      const m = text.match(/\/\*DATA_START\*\/([\s\S]*?)\/\*DATA_END\*\//);
      if (!m) throw new Error("marqueurs introuvables");
      const scope = Function(m[1] + "\nreturn {AIRCRAFT, KANNAD_DATE};")();
      render(scope.AIRCRAFT, scope.KANNAD_DATE);
    } catch (e){
      // Repli : si le fetch local échoue (accès fichier bloqué, fichier en cours
      // d'écriture...), on retombe sur un rechargement complet plutôt que de rester
      // figé sur des données périmées sans le signaler.
      location.reload();
    }
  }
  setInterval(refreshData, 5000);
</script>
